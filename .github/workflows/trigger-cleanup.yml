name: Daily Cleanup Trigger

on:
  schedule:
    - cron: '0 3 * * *'  # 3 AM UTC

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cleanup workflow
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/cleanup.yml/dispatches \
            -d '{"ref":"main"}'