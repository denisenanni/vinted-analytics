name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./scraper
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Run unit tests
        working-directory: ./scraper
        run: pytest tests/test_spider.py tests/test_database.py -v

      - name: Run integration tests
        working-directory: ./scraper
        continue-on-error: true  # Integration tests are flaky (hit real websites)
        run: pytest tests/test_integration.py -v -m integration --timeout=120
