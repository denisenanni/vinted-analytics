name: Scheduled Scrape

on:
  schedule:
    - cron: '0 */12 * * *'  # Every 12 hours
  workflow_dispatch:  # Manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        market: [IT, FR, DE, ES, NL, PL, BE, AT, PT]
      max-parallel: 3  # Limit concurrent jobs to avoid rate limiting

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./scraper
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Run scraper for ${{ matrix.market }}
        working-directory: ./scraper
        env:
          USE_SUPABASE: 'true'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          # Women's clothing
          python -m src.main --market ${{ matrix.market }} --category women/dresses --pages 2
          python -m src.main --market ${{ matrix.market }} --category women/tops-and-t-shirts --pages 2
          python -m src.main --market ${{ matrix.market }} --category women/jumpers-and-sweaters --pages 2
          python -m src.main --market ${{ matrix.market }} --category women/jeans --pages 2
          python -m src.main --market ${{ matrix.market }} --category women/trousers-and-leggings --pages 2
          python -m src.main --market ${{ matrix.market }} --category women/skirts --pages 2
          python -m src.main --market ${{ matrix.market }} --category women/outerwear --pages 2
          python -m src.main --market ${{ matrix.market }} --category women/suits-and-blazers --pages 2
          python -m src.main --market ${{ matrix.market }} --category women/activewear --pages 2
          # Women's shoes
          python -m src.main --market ${{ matrix.market }} --category women/boots --pages 2
          python -m src.main --market ${{ matrix.market }} --category women/heels --pages 2
          python -m src.main --market ${{ matrix.market }} --category women/trainers --pages 2
          python -m src.main --market ${{ matrix.market }} --category women/sandals --pages 2
          # Women's bags
          python -m src.main --market ${{ matrix.market }} --category women/handbags --pages 2
          python -m src.main --market ${{ matrix.market }} --category women/backpacks --pages 2
          python -m src.main --market ${{ matrix.market }} --category women/shoulder-bags --pages 2
          # Women's accessories
          python -m src.main --market ${{ matrix.market }} --category women/jewellery --pages 2
          python -m src.main --market ${{ matrix.market }} --category women/watches --pages 2
          python -m src.main --market ${{ matrix.market }} --category women/sunglasses --pages 2
          # Men's clothing
          python -m src.main --market ${{ matrix.market }} --category men/tops-and-t-shirts --pages 2
          python -m src.main --market ${{ matrix.market }} --category men/jumpers-and-sweaters --pages 2
          python -m src.main --market ${{ matrix.market }} --category men/jeans --pages 2
          python -m src.main --market ${{ matrix.market }} --category men/trousers --pages 2
          python -m src.main --market ${{ matrix.market }} --category men/outerwear --pages 2
          python -m src.main --market ${{ matrix.market }} --category men/suits-and-blazers --pages 2
          python -m src.main --market ${{ matrix.market }} --category men/activewear --pages 2
          # Men's shoes
          python -m src.main --market ${{ matrix.market }} --category men/boots --pages 2
          python -m src.main --market ${{ matrix.market }} --category men/trainers --pages 2
          python -m src.main --market ${{ matrix.market }} --category men/formal-shoes --pages 2
          # Men's accessories
          python -m src.main --market ${{ matrix.market }} --category men/bags-and-backpacks --pages 2
          python -m src.main --market ${{ matrix.market }} --category men/jewellery --pages 2
          python -m src.main --market ${{ matrix.market }} --category men/watches --pages 2
          python -m src.main --market ${{ matrix.market }} --category men/sunglasses --pages 2
